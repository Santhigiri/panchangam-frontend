server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker script must always be revalidated — if a browser
    # (or an installed/standalone PWA) caches a stale sw.js, it never notices
    # a new deploy exists and updates silently stop being detected.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The SPA shell references content-hashed asset filenames from whichever
    # build produced it, so it must also always be revalidated to pick up a
    # new build's asset references.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite content-hashes build assets (assets/index-<hash>.js etc.), so these
    # are safe to cache indefinitely — a changed file gets a new filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
